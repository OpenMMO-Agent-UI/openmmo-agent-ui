name: Release sync from upstream

# Watches Julian-adv/OpenMMO for new agent-client releases and runs the
# .claude/skills/openmmo-release-sync skill when one appears: fast-forward
# the fork, rebase tweak-agent-client (conflicts resolved by the agent per
# the skill's policy), run both repos' full build+test gates, bump the pin,
# tag, wait for release CI, and publish.
#
# Requires two repo secrets:
#   WIKI_RELEASE_TOKEN      PAT that can push to BOTH
#                           OpenMMO-Agent-UI/OpenMMO (fork) and this repo,
#                           and publish releases here. A v* tag pushed with
#                           this PAT (not GITHUB_TOKEN) still triggers
#                           release.yml — that is the point of using it.
#   CLAUDE_CODE_OAUTH_TOKEN Claude subscription token (claude setup-token),
#                           same as the wiki repo uses.

on:
  schedule:
    # Hourly, offset off the :00 herd. It was every 5 minutes, on the
    # reasoning that the check costs seconds and the repo is public so the
    # minutes are free — both true, and it still did not run. GitHub drops
    # high-frequency scheduled runs, and measured over 2026-08-27..29 this
    # one fired roughly every ten hours: 16:29, 01:05, 12:43, 22:43. Both of
    # the wiki repo's daily crons, meanwhile, land within minutes of their
    # slot every day. So the frequency was buying nothing and costing the
    # thing it was for — the server moved to v40 and then v44 with nobody
    # noticing until a player could not log in, twice.
    #
    # Hourly is a guess at what GitHub will honour, not a guarantee. If it
    # still drops runs, the fix is an event rather than a schedule: see
    # `repository_dispatch` below.
    - cron: '19 * * * *'
  # For a watcher that can see the live server — the wiki repo already probes
  # it (`scripts/server-protocol.mjs`) on a schedule that does run. Firing
  # this needs a token with write access here, which that repo does not have
  # yet; adding one is what turns detection from "eventually" into "within
  # the hour of the server moving".
  #
  #   gh api repos/OpenMMO-Agent-UI/openmmo-agent-ui/dispatches \
  #     -f event_type=server-protocol-changed
  repository_dispatch:
    types: [server-protocol-changed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-sync
  cancel-in-progress: false

jobs:
  # Cheap gate: wake the agent when Julian has a release our pin lacks, or
  # when the live server has stopped accepting the build we ship.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needs-sync: ${{ steps.cmp.outputs.needs-sync }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # "Has Julian released something we lack?" and "can our users log in?"
      # are different questions, and only the first used to be asked. A
      # redeploy off upstream master moved the dungeon generator without a
      # release or a protocol bump on 2026-08-23; every shipped client was
      # refused and this gate saw nothing to do for hours. No `npm ci`: the
      # probe is dependency-free on purpose.
      - id: server
        run: |
          node scripts/server-accepts-pin.js | tee gate.json
          accepted="$(node -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync("gate.json","utf8")).accepted))')"
          echo "accepted=$accepted" >> "$GITHUB_OUTPUT"
      - id: cmp
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_ACCEPTS_PIN: ${{ steps.server.outputs.accepted }}
        run: |
          # scripts/release-sync-check.js needs the submodule's object graph,
          # which this job deliberately doesn't clone. Same ancestry question
          # via the compare API instead: is Julian's latest release commit
          # already contained in our pin? Both SHAs live in the fork once a
          # sync has run; a brand-new release isn't there yet, so compare
          # fails and we correctly wake the agent.
          tag="$(gh api repos/Julian-adv/OpenMMO/releases --jq '[.[] | select(.draft == false)] | sort_by(.published_at) | reverse | .[0].tag_name')"
          # Peeled ref first: an annotated tag's own object SHA 404s in the
          # compare API, which read as "unknown" and woke the agent every run.
          relsha="$(git ls-remote https://github.com/Julian-adv/OpenMMO.git "refs/tags/${tag}^{}" | cut -f1)"
          [[ -n "$relsha" ]] || relsha="$(git ls-remote https://github.com/Julian-adv/OpenMMO.git "refs/tags/${tag}" | cut -f1)"
          pin="$(git ls-tree HEAD deps/OpenMMO | awk '{print $3}')"
          status="$(gh api "repos/OpenMMO-Agent-UI/OpenMMO/compare/${relsha}...${pin}" --jq .status 2>/dev/null || echo unknown)"
          echo "release=$tag ($relsha) pin=$pin compare=$status server-accepts-pin=$SERVER_ACCEPTS_PIN"
          # `null` is "could not ask" — a network blip must not fire a
          # two-hour sync, so only an outright refusal counts.
          if [[ "$SERVER_ACCEPTS_PIN" == "false" ]]; then
            echo "the live server refuses the build we ship — syncing regardless of releases"
            echo "needs-sync=true" >> "$GITHUB_OUTPUT"
          elif [[ "$status" == "identical" || "$status" == "ahead" ]]; then
            echo "needs-sync=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs-sync=true" >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: check
    if: needs.check.outputs.needs-sync == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.WIKI_RELEASE_TOKEN }} # pushes to this repo use the PAT
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Pinned, not floating: the Step 3 gate runs clippy -D warnings
          # over UPSTREAM code too, so a fresh stable that ships a new lint
          # (1.98.0 -> chunks_exact_to_as_chunks, 2026-08-21) blocks every
          # sync until Julian adapts. Bump deliberately once upstream is clean
          # on the new stable.
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: deps/OpenMMO
      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - name: Cache game model assets
        uses: actions/cache@v4
        with:
          path: deps/OpenMMO/client/public/models
          key: game-models-${{ hashFiles('deps/OpenMMO/assets.lock') }}
      - name: Fetch game model assets
        # Upstream's client tests read real .glb files (fetched from a
        # Hugging Face dataset, never stored in git) — without them the
        # Step 3 gate fails on asset-reading tests. Idempotent and
        # sha-verified, so the cache makes this a no-op most runs.
        run: bash deps/OpenMMO/tools/fetch-assets.sh client/public/models
      - name: Wire the PAT into every github.com remote (incl. the fork submodule)
        env:
          PAT: ${{ secrets.WIKI_RELEASE_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${PAT}@github.com/".insteadOf "https://github.com/"
          git config --global user.name "openmmo-release-sync"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run the release-sync skill
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.WIKI_RELEASE_TOKEN }} # gh release publish etc.
          # Step 3's `npm run build:wasm` is a multi-minute cold wasm compile.
          # At the 2-minute default the harness auto-backgrounds it, and the
          # agent cannot then wait on it — the v0.40.0 sync (run 33592051530)
          # ended its turn saying it would "resume once it finishes", shipped
          # nothing, and a human released by hand hours later. Also set in
          # cron-settings.json, which covers the local launchd path; repeated
          # here because the runner env is the one path guaranteed to reach
          # the process.
          BASH_DEFAULT_TIMEOUT_MS: '1200000'
          BASH_MAX_TIMEOUT_MS: '1800000'
        with:
          github_token: ${{ secrets.WIKI_RELEASE_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /openmmo-release-sync
            CI notes: PushNotification is unavailable here — end with a plain
            summary instead, and on an abort describe exactly which step and
            why. Skip the skill's "Local environment prerequisites" section:
            this runner already has rustup (with wasm32-unknown-unknown),
            wasm-pack, node 22, an authenticated gh, and the game model
            assets pre-fetched under deps/OpenMMO/client/public/models.
          show_full_output: true
          claude_args: |
            --model claude-sonnet-5
            --settings .claude/skills/openmmo-release-sync/cron-settings.json
      - name: Fail loudly unless the sync actually shipped
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # An agent that hits a wall ends its run politely, which reads as
          # job success — v0.29.0 silently didn't ship that way. Re-ask the
          # gate's question after the fact: Julian's latest release must now
          # be contained in the pin AND published as a client release.
          tag="$(gh api repos/Julian-adv/OpenMMO/releases --jq '[.[] | select(.draft == false)] | sort_by(.published_at) | reverse | .[0].tag_name')"
          relsha="$(git ls-remote https://github.com/Julian-adv/OpenMMO.git "refs/tags/${tag}^{}" | cut -f1)"
          [[ -n "$relsha" ]] || relsha="$(git ls-remote https://github.com/Julian-adv/OpenMMO.git "refs/tags/${tag}" | cut -f1)"
          git fetch --quiet origin master
          pin="$(git ls-tree origin/master deps/OpenMMO | awk '{print $3}')"
          status="$(gh api "repos/OpenMMO-Agent-UI/OpenMMO/compare/${relsha}...${pin}" --jq .status 2>/dev/null || echo unknown)"
          ver="${tag#agent-client-}"
          draft="$(gh release view "$ver" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
          echo "release=$tag pin-contains-it=$status client-release-$ver=$draft"
          # release.yml publishes on its own once the tag is built, so a pin
          # that already carries the release plus a release build in flight
          # is "shipping", not a failure — the agent cannot sit through a
          # 20-minute CI build to say so itself.
          building="$(gh run list --workflow=release.yml --branch "$ver" --limit 1 --json status --jq '.[0].status // "none"' 2>/dev/null || echo none)"
          if [[ ("$status" == "identical" || "$status" == "ahead") && "$draft" == "false" ]]; then
            echo "shipped."
          elif [[ ("$status" == "identical" || "$status" == "ahead") && ("$building" == "in_progress" || "$building" == "queued") ]]; then
            echo "shipping: pin carries $tag and release.yml is $building for $ver."
          else
            echo "::error::sync job finished but $tag did not ship (compare=$status, $ver draft-state=$draft) — read the agent summary above" >&2
            exit 1
          fi
