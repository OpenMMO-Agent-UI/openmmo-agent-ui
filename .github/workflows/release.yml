name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      parent-sha: ${{ steps.plan.outputs.parent-sha }}
      openmmo-sha: ${{ steps.plan.outputs.openmmo-sha }}
      protocol: ${{ steps.plan.outputs.protocol }}
      artifact-prefix: ${{ steps.plan.outputs.artifact-prefix }}
      linux-artifact: ${{ steps.plan.outputs.linux-artifact }}
      macos-artifact: ${{ steps.plan.outputs.macos-artifact }}
      windows-artifact: ${{ steps.plan.outputs.windows-artifact }}
      release-action: ${{ steps.plan.outputs.release-action }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
          lfs: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            deps/OpenMMO/client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix deps/OpenMMO/client ci
      - name: Inspect existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" 2>release-error.txt)"; then
            if [[ "$(jq -r '.draft' <<<"$release_json")" == "true" ]]; then
              echo "state=draft" >> "$GITHUB_OUTPUT"
              existing_parent="$(jq -r 'try (.body | capture("(?m)^Parent commit: (?<sha>[0-9a-f]{40})$").sha) catch ""' <<<"$release_json")"
              echo "parent-sha=$existing_parent" >> "$GITHUB_OUTPUT"
            else
              echo "state=published" >> "$GITHUB_OUTPUT"
              echo "parent-sha=" >> "$GITHUB_OUTPUT"
            fi
          elif grep -q "HTTP 404" release-error.txt; then
            echo "state=absent" >> "$GITHUB_OUTPUT"
            echo "parent-sha=" >> "$GITHUB_OUTPUT"
          else
            cat release-error.txt >&2
            exit 1
          fi
      - name: Plan and validate release
        id: plan
        env:
          RELEASE_STATE: ${{ steps.release.outputs.state }}
          EXISTING_PARENT_SHA: ${{ steps.release.outputs.parent-sha }}
        run: |
          git fetch origin master:refs/remotes/origin/master
          plan="$(node scripts/release-plan.js plan \
            --tag "$GITHUB_REF_NAME" \
            --release-state "$RELEASE_STATE" \
            --existing-parent-sha "$EXISTING_PARENT_SHA")"
          node - "$GITHUB_OUTPUT" "$plan" <<'NODE'
          const fs = require('node:fs')
          const [output, encoded] = process.argv.slice(2)
          const plan = JSON.parse(encoded)
          const lines = [
            `version=${plan.version}`,
            `tag=${plan.tag}`,
            `parent-sha=${plan.parentSha}`,
            `openmmo-sha=${plan.openmmoSha}`,
            `protocol=${plan.protocolVersion}`,
            `artifact-prefix=${plan.artifactPrefix}`,
            `linux-artifact=${plan.artifacts.linux}`,
            `macos-artifact=${plan.artifacts.macos}`,
            `windows-artifact=${plan.artifacts.windows}`,
            `release-action=${plan.releaseAction}`,
          ]
          fs.appendFileSync(output, `${lines.join('\n')}\n`)
          NODE
      - run: npm test
      - run: npm --prefix deps/OpenMMO/client run build:wasm
      - run: npm --prefix deps/OpenMMO/client test
      - run: npm --prefix deps/OpenMMO/client run check

  package:
    needs: validate
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS arm64
            command: dist:mac
            artifact: ${{ needs.validate.outputs.macos-artifact }}
          - os: windows-latest
            label: Windows x64
            command: dist:win
            artifact: ${{ needs.validate.outputs.windows-artifact }}
          - os: ubuntu-latest
            label: Linux x64
            command: dist:linux
            artifact: ${{ needs.validate.outputs.linux-artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          lfs: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            deps/OpenMMO/client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: deps/OpenMMO
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: npm ci
      - name: Import Developer ID certificate
        if: matrix.os == 'macos-14'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          # We sign by hand (see the step below), not via electron-builder's
          # own deep-signing — so all this needs to do is get the Developer ID
          # identity into a keychain `codesign` can use. No intermediate-cert
          # bundling required: macOS ships Apple's Developer ID CA/WWDR
          # intermediates in its System Roots trust store already, which is
          # why plain `codesign --verify` validates without us adding them.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          p12_path="$RUNNER_TEMP/cert.p12"
          printf '%s' "$CSC_LINK" | base64 --decode > "$p12_path"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12_path" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db

          identity="$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application:[^"]*"' | head -1 | tr -d '"')"
          [[ -n "$identity" ]] || { echo "no Developer ID Application identity found in the imported certificate" >&2; exit 1; }

          {
            echo "SIGNING_KEYCHAIN=$keychain"
            echo "SIGNING_IDENTITY=$identity"
          } >> "$GITHUB_ENV"
      - name: Build package
        shell: bash
        env:
          APP_VERSION: ${{ needs.validate.outputs.version }}
          ARTIFACT_NAME: ${{ matrix.artifact }}
          DESKTOP_BUILD_SHA: ${{ needs.validate.outputs.parent-sha }}
          OPENMMO_BUILD_SHA: ${{ needs.validate.outputs.openmmo-sha }}
          OPENMMO_PROTOCOL_VERSION: ${{ needs.validate.outputs.protocol }}
          # Leave electron-builder's own mac signing off. It only knows how to
          # deep-sign (re-sign every nested framework/locale file, each with
          # an Apple-timestamped codesign call) and auto-notarize once an
          # identity is visible — both of which the step below replaces with
          # a faster hand-rolled equivalent.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run ${{ matrix.command }} -- --config.extraMetadata.version="$APP_VERSION" --config.artifactName="$ARTIFACT_NAME"
      - name: Sign app bundle and repackage
        if: matrix.os == 'macos-14'
        env:
          ARTIFACT_NAME: ${{ matrix.artifact }}
        run: |
          # A single top-level `codesign` pass is NOT enough here: Electron's
          # npm package ships several nested frameworks and helper apps
          # (Squirrel.framework, Mantle.framework, ReactiveObjC.framework, the
          # GPU/Renderer/Plugin helper .apps) with an incomplete signature —
          # ad-hoc, no resource seal — that passes loose `codesign --verify`
          # but fails the *strict* check Gatekeeper runs on a quarantined
          # (i.e. downloaded) app, producing "OpenMMO Agent is damaged and
          # can't be opened" with no bypass. Confirmed by reproducing it with
          # `spctl -a -t exec` against a real release artifact. Every nested
          # bundle has to be individually re-signed to get a valid resource
          # seal, same as electron-builder's own deep-signing would do.
          #
          # What we skip, on purpose, is `--timestamp` on the nested items:
          # that's what made electron-builder's own deep-sign take ~20
          # minutes (~100 files, each a network round-trip to Apple's
          # timestamp authority). Only the outer bundle's signature benefits
          # from a timestamp, so only it gets `--timestamp` — that's one
          # network call, not a hundred.
          #
          # This still is not notarized, so Gatekeeper correctly shows the
          # recoverable "Apple could not verify this app is free of malware"
          # warning on first launch (right-click > Open bypasses it) — that's
          # expected and distinct from the "damaged" failure above.
          app="out/mac-arm64/OpenMMO Agent.app"
          [[ -d "$app" ]] || { echo "expected app bundle not found at $app" >&2; exit 1; }

          sign() {
            codesign --force \
              --sign "$SIGNING_IDENTITY" \
              --keychain "$SIGNING_KEYCHAIN" \
              --options runtime \
              --entitlements config/entitlements.mac.plist \
              "$1"
          }

          while IFS= read -r -d '' item; do
            sign "$item"
          done < <(find "$app/Contents/Frameworks" -maxdepth 1 \( -iname '*.framework' -o -iname '*.app' \) -print0)
          sign "$app/Contents/Resources/agent-client/agent-client"

          codesign --force \
            --sign "$SIGNING_IDENTITY" \
            --keychain "$SIGNING_KEYCHAIN" \
            --options runtime \
            --timestamp \
            --entitlements config/entitlements.mac.plist \
            "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          # electron-builder already zipped the unsigned build under this same
          # name; replace it with a zip of the now-signed bundle. Use ditto,
          # not `zip`, so the signature and extended attributes survive.
          rm -f "out/$ARTIFACT_NAME" "out/$ARTIFACT_NAME.blockmap"
          ditto -c -k --sequesterRsrc --keepParent "$app" "out/$ARTIFACT_NAME"
      - name: Clean up signing keychain
        if: always() && matrix.os == 'macos-14'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/${{ matrix.artifact }}
          if-no-files-found: error

  draft-release:
    needs: [validate, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.validate.outputs.artifact-prefix }}-*
          path: artifacts
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: artifacts
        run: sha256sum ./* > SHA256SUMS.txt
      - name: Write release notes
        env:
          APP_VERSION: ${{ needs.validate.outputs.version }}
          PARENT_SHA: ${{ needs.validate.outputs.parent-sha }}
          OPENMMO_SHA: ${{ needs.validate.outputs.openmmo-sha }}
          PROTOCOL: ${{ needs.validate.outputs.protocol }}
        run: |
          cat > release-notes.md <<EOF
          Preview build

          App version: ${APP_VERSION}
          Parent commit: ${PARENT_SHA}
          OpenMMO commit: ${OPENMMO_SHA}
          Protocol version: ${PROTOCOL}

          Compatible with servers requiring protocol v${PROTOCOL}.

          macOS build is signed with a Developer ID certificate but not notarized —
          Gatekeeper will still warn on first launch; right-click the app and choose
          Open to bypass. Windows and Linux builds are unsigned; Windows SmartScreen
          may warn similarly.
          Verify downloads against SHA256SUMS.txt before testing.
          EOF
      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ACTION: ${{ needs.validate.outputs.release-action }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          APP_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if [[ "$RELEASE_ACTION" == "create" ]]; then
            gh release create "$RELEASE_TAG" artifacts/* \
              --draft \
              --title "OpenMMO Agent v${APP_VERSION}" \
              --notes-file release-notes.md
          elif [[ "$RELEASE_ACTION" == "refresh" ]]; then
            gh release edit "$RELEASE_TAG" \
              --draft \
              --title "OpenMMO Agent v${APP_VERSION}" \
              --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" artifacts/* --clobber
          else
            echo "unknown release action: $RELEASE_ACTION" >&2
            exit 1
          fi
