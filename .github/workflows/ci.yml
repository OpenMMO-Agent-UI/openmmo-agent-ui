name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
          lfs: false
      - name: Checkout OpenMMO submodule
        run: |
          set -euo pipefail
          openmmo_sha="$(git rev-parse HEAD:deps/OpenMMO)"
          openmmo_url="$(git config -f .gitmodules submodule.deps/OpenMMO.url)"
          openmmo_branch="tweak-agent-client"
          # Fetch the pinned SHA by name rather than trusting it to sit in a
          # depth-1 history of the branch tip. `tweak-agent-client` is our patch
          # stack *rebased* onto each upstream release, so every sync force-pushes
          # it and orphans the SHA the previous pin named — the commit is still
          # served, but it is no longer an ancestor of the tip. That makes the
          # shallow clone fail with `unable to read tree` for the whole window
          # between pushing the rebase and bumping the pin, and permanently for
          # any older tag. Both bit us on 2026-10-10 at protocol 118.
          # Deep enough to still contain the upstream release commit our patch
          # stack sits on: the ownership-scoped gates below need a merge-base
          # against it, and a depth-1 fetch has no common history to find one
          # in — which fails silently under `set -e` with `--quiet`.
          git init --quiet deps/OpenMMO
          git -C deps/OpenMMO remote add origin "$openmmo_url"
          git -C deps/OpenMMO fetch --quiet --depth=25 origin "$openmmo_sha" \
            || git -C deps/OpenMMO fetch --quiet --depth=25 origin "$openmmo_branch"
          git -C deps/OpenMMO checkout --quiet --detach "$openmmo_sha"
          git -C deps/OpenMMO submodule update --init --force --depth=1 --recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            deps/OpenMMO/client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: npm ci
      - run: npm --prefix deps/OpenMMO/client ci
      - run: npm run validate:pin
      - run: npm test
      - run: bash deps/OpenMMO/tools/fetch-assets.sh client/public/
      - run: npm --prefix deps/OpenMMO/client run build:wasm
      # The last two unscoped copies of gates the release-sync skill and
      # release.yml already scope by ownership. Leaving them whole-tree here
      # meant upstream's own breakage still painted master red, which is not a
      # cosmetic problem: a red master is what Steps 3 and 6 refuse to release
      # on top of. On 2026-10-10 that was `characterModel.test.ts` — 1 of 184
      # files, failing on `face_*.glb` that upstream never pinned in
      # assets.lock — and it held protocol 118 back after the sync itself had
      # already been fixed. Scope every copy or none; scoping some is how
      # v0.42.0 burned a tag.
      - name: Client tests and type-check, scoped to files this fork changed
        run: |
          set -euo pipefail
          git -C deps/OpenMMO fetch --quiet --depth=25 origin master
          # The sync fast-forwards the fork's master to the upstream release our
          # stack is rebased onto, so master's tip is the base. merge-base is
          # the honest answer when it can be computed; say so rather than let
          # `set -e` kill the step with no output, the way it just did.
          base="$(git -C deps/OpenMMO merge-base HEAD origin/master \
            || git -C deps/OpenMMO rev-parse origin/master)"
          echo "scoping gates against base $base"
          node scripts/client-test-ours.js deps/OpenMMO "$base"
          node scripts/check-ours.js deps/OpenMMO "$base"
