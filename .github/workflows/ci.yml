name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
          lfs: false
      - name: Checkout OpenMMO submodule
        run: |
          set -euo pipefail
          openmmo_sha="$(git rev-parse HEAD:deps/OpenMMO)"
          openmmo_url="$(git config -f .gitmodules submodule.deps/OpenMMO.url)"
          openmmo_branch="tweak-agent-client"
          git clone --depth=1 --branch "$openmmo_branch" "$openmmo_url" deps/OpenMMO
          git -C deps/OpenMMO checkout --detach "$openmmo_sha"
          git -C deps/OpenMMO submodule update --init --force --depth=1 --recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            deps/OpenMMO/client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: npm ci
      - run: npm --prefix deps/OpenMMO/client ci
      - run: npm run validate:pin
      - run: npm test
      - run: bash deps/OpenMMO/tools/fetch-assets.sh client/public/
      - run: npm --prefix deps/OpenMMO/client run build:wasm
      - run: npm --prefix deps/OpenMMO/client test
      - run: npm --prefix deps/OpenMMO/client run check
