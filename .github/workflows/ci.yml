name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          lfs: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            deps/OpenMMO/client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: npm ci
      - run: npm --prefix deps/OpenMMO/client ci
      - run: npm run validate:pin
      - run: npm test
      - run: bash deps/OpenMMO/tools/fetch-assets.sh client/public/
      - run: npm --prefix deps/OpenMMO/client run build:wasm
      - run: npm --prefix deps/OpenMMO/client test
      - run: npm --prefix deps/OpenMMO/client run check
