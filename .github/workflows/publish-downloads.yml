name: Publish downloads to wiki

# Mirrors a published release's artifacts to the public wiki repo, which is
# where players actually download from — this repository is private, so its
# own release assets are not anonymously reachable.
#
# Triggered by `release: published` rather than the tag push, so the mirror
# only ever runs on artifacts that finished building, signing and notarizing.
# release.yml publishes straight away — a draft waiting on a human is how the
# download link once sat a protocol version behind for a day.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to mirror (e.g. v0.17.0)
        required: true

permissions:
  contents: read

concurrency:
  group: publish-downloads
  cancel-in-progress: false

env:
  WIKI_REPO: OpenMMO-Agent-UI/openmmo-agent-wiki

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Only for scripts/verify-update-feed.js — the mirror itself works
      # entirely through the gh CLI.
      - uses: actions/checkout@v5

      - name: Resolve tag
        id: tag
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${EVENT_TAG:-$INPUT_TAG}"
          [[ -n "$tag" ]] || { echo "no tag to publish" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release download "$TAG" --dir artifacts --clobber

      - name: Extract protocol from artifact names
        id: stage
        working-directory: artifacts
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          # Filenames keep their full version+protocol so a downloaded file
          # says which build it is. Nothing depends on stable names anymore:
          # the wiki's links are rewritten to match in the step below.
          protocol=""
          for f in openmmo-agent-v"$VERSION"-p*-*; do
            [[ -e "$f" ]] || continue
            [[ "$f" =~ -p([0-9]+)- ]] && protocol="${BASH_REMATCH[1]}"
          done
          [[ -n "$protocol" ]] || { echo "no protocol version found in artifact names" >&2; exit 1; }

          rm -f SHA256SUMS.txt
          sha256sum ./* > SHA256SUMS.txt
          echo "protocol=$protocol" >> "$GITHUB_OUTPUT"
          ls -la

      - name: Write release notes
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          PROTOCOL: ${{ steps.stage.outputs.protocol }}
        run: |
          cat > notes.md <<EOF
          OpenMMO Agent UI v${VERSION} — protocol v${PROTOCOL}

          Compatible with servers requiring protocol v${PROTOCOL}. The server
          matches the protocol version exactly, so a newer client is not
          automatically a working one.

          The macOS build is signed with a Developer ID certificate and
          notarized by Apple. Windows and Linux builds are unsigned; Windows
          SmartScreen may warn on first run — see the install guide:
          https://openmmo-agent-ui.github.io/openmmo-agent-wiki/client/install/

          Verify your download against SHA256SUMS.txt.

          OpenMMO Agent is free and open source — if you enjoy it, you can
          support development at https://ko-fi.com/dakywang ☕
          EOF

      - name: Publish to the wiki repo, keeping only this release
        env:
          GH_TOKEN: ${{ secrets.WIKI_RELEASE_TOKEN }}
          VERSION: ${{ steps.tag.outputs.version }}
          PROTOCOL: ${{ steps.stage.outputs.protocol }}
        run: |
          [[ -n "$GH_TOKEN" ]] || {
            echo "WIKI_RELEASE_TOKEN is not set — add a token with contents:write on $WIKI_REPO" >&2
            exit 1
          }
          new_tag="client-v${VERSION}"
          title="OpenMMO Agent UI v${VERSION} (protocol v${PROTOCOL})"

          # Publish first, prune second: a failed upload leaves the old download
          # working rather than leaving the wiki with no release at all.
          #
          # Refresh rather than create when the tag already exists, so a
          # workflow_dispatch re-run of the same version is idempotent instead
          # of failing on "release already exists".
          if gh release view "$new_tag" --repo "$WIKI_REPO" >/dev/null 2>&1; then
            gh release edit "$new_tag" --repo "$WIKI_REPO" \
              --title "$title" --notes-file notes.md --latest
            gh release upload "$new_tag" artifacts/* --repo "$WIKI_REPO" --clobber
          else
            gh release create "$new_tag" artifacts/* --repo "$WIKI_REPO" \
              --title "$title" --notes-file notes.md --latest
          fi

          for old in $(gh release list --repo "$WIKI_REPO" --limit 100 --json tagName --jq '.[].tagName'); do
            [[ "$old" == "$new_tag" ]] && continue
            echo "removing superseded release $old"
            gh release delete "$old" --repo "$WIKI_REPO" --cleanup-tag --yes
          done

      - name: Verify the update feed
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          node scripts/verify-update-feed.js artifacts "$VERSION" \
            "https://github.com/${WIKI_REPO}/releases/latest/download"

      - name: Point the wiki's links at this release
        env:
          GH_TOKEN: ${{ secrets.WIKI_RELEASE_TOKEN }}
          VERSION: ${{ steps.tag.outputs.version }}
          PROTOCOL: ${{ steps.stage.outputs.protocol }}
        run: |
          # Filenames carry the version, so the wiki has to learn each new
          # name: release.json drives the site's download pages, and the
          # README names the files literally. A PAT push (not GITHUB_TOKEN)
          # triggers the wiki's own deploy workflow, so the site rebuilds.
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${WIKI_REPO}.git" wiki-checkout
          cd wiki-checkout
          mkdir -p src/data
          cat > src/data/release.json <<EOF
          {
            "version": "${VERSION}",
            "protocol": ${PROTOCOL},
            "files": {
              "mac": "openmmo-agent-v${VERSION}-p${PROTOCOL}-macos-arm64.dmg",
              "win": "openmmo-agent-v${VERSION}-p${PROTOCOL}-windows-x64.exe",
              "linux": "openmmo-agent-v${VERSION}-p${PROTOCOL}-linux-x64.AppImage"
            }
          }
          EOF
          # Rewrite whatever filename the README carries (stable-era or an
          # older versioned one) to this release's.
          sed -E -i \
            -e "s/openmmo-agent-(v[0-9.]+-p[0-9]+-)?macos-arm64\.dmg/openmmo-agent-v${VERSION}-p${PROTOCOL}-macos-arm64.dmg/g" \
            -e "s/openmmo-agent-(v[0-9.]+-p[0-9]+-)?windows-x64\.exe/openmmo-agent-v${VERSION}-p${PROTOCOL}-windows-x64.exe/g" \
            -e "s/openmmo-agent-(v[0-9.]+-p[0-9]+-)?linux-x64\.AppImage/openmmo-agent-v${VERSION}-p${PROTOCOL}-linux-x64.AppImage/g" \
            README.md
          if git diff --quiet; then
            echo "wiki already points at v${VERSION}"
          else
            git config user.name "openmmo-release-sync"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "release: point downloads at v${VERSION} (protocol v${PROTOCOL})"
            git push
          fi
